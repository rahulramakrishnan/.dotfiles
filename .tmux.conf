# set ctrl-a as the global prefix instead of ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# set history to be large
set-option -g history-limit 10000

# remap window navigation to vim
unbind-key j
bind-key j select-pane -D
unbind-key k
bind-key k select-pane -U
unbind-key h
bind-key h select-pane -L
unbind-key l
bind-key l select-pane -R

# Enable mouse support
set -g mouse on

# Use 256 colors
set -g default-terminal "screen-256color"

# Set window and pane index to 1 (0 by default)
set -g base-index 1
setw -g pane-base-index 1

# Tmux Plugin Manager (TPM) - for managing tmux plugins
# Location: ~/.tmux/plugins/tpm
# Install with: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then press: <prefix> + I to install plugins
set -g @plugin 'tmux-plugins/tpm'

# Plugin: tmux-resurrect - saves and restores tmux sessions
# Usage: <prefix> + Ctrl-s to save, <prefix> + Ctrl-r to restore
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Plugin: tmux-continuum - automatically saves tmux sessions
# Saves every 15 minutes and restores on tmux startup
set -g @plugin 'tmux-plugins/tmux-continuum'

# Configure tmux-continuum
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Initialize TMUX Plugin Manager (keep this at the very end of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
